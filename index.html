
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:white;font-family:Tahoma,Arial}
header{background:#111124;padding:20px;text-align:center;border-bottom:2px solid #8b5cf6}
h1{color:#a78bfa;margin:0}
.container{max-width:900px;margin:25px auto;padding:15px}
.card{background:#151529;border:1px solid #51358c;border-radius:15px;padding:20px;margin-bottom:20px}
input,textarea,select{width:100%;padding:13px;margin:7px 0;background:#090914;color:white;border:1px solid #514080;border-radius:8px}
button{padding:12px 18px;margin:5px;background:#8b5cf6;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
button:hover{background:#6d28d9}
.stream{padding:15px;margin:10px 0;background:#20203a;border-radius:10px}
small{color:#a78bfa}
#message{color:#67e8f9;line-height:2}
</style>
</head>
<body>

<header>
<h1>💜 NEXORA LIVE</h1>
<p>دنیای استریم زنده</p>
</header>

<div class="container">

<div class="card">
<h2>ورود به حساب</h2>
<input id="loginEmail" type="email" placeholder="ایمیل">
<input id="loginPassword" type="password" placeholder="رمز عبور">
<button id="loginBtn">ورود</button>
</div>

<div class="card">
<h2>ساخت حساب جدید</h2>
<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)">
<input id="username" placeholder="نام کاربری انگلیسی">
<input id="displayName" placeholder="نام نمایشی">
<button id="signupBtn">ثبت‌نام</button>
</div>

<div class="card">
<h2>حساب کاربری</h2>
<p id="profile">هنوز وارد حساب نشده‌ای.</p>
<button id="logoutBtn" hidden>خروج از حساب</button>
</div>

<div class="card">
<h2>🎥 ساخت استریم</h2>
<input id="streamTitle" placeholder="عنوان استریم">
<input id="streamCategory" placeholder="دسته‌بندی بازی">
<textarea id="streamDescription" placeholder="توضیحات استریم"></textarea>
<button id="createBtn">ایجاد استریم</button>
</div>

<div class="card">
<h2>🔥 استریم‌های NEXORA</h2>
<div id="streams">در حال بارگذاری...</div>
<button id="refreshBtn">بروزرسانی</button>
</div>

<p id="message"></p>
</div>

<script>
const SUPABASE_URL="https://vpaendrlgltucjvayjcr.supabase.co";
const SUPABASE_KEY="sb_publishable_ebelTlrDPzeqZKQpUqWE_g_VB0SGC1c";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function msg(text){
 $("message").textContent=text;
}

async function signup(){
 const email=$("email").value.trim();
 const password=$("password").value;
 const username=$("username").value.trim().toLowerCase();
 const display_name=$("displayName").value.trim()||username;

 if(!email||!username||password.length<6){
  msg("ایمیل، نام کاربری و رمز حداقل ۶ کاراکتری را وارد کن.");
  return;
 }

 if(!/^[a-z0-9_]{3,24}$/.test(username)){
  msg("نام کاربری باید ۳ تا ۲۴ حرف انگلیسی، عدد یا _ باشد.");
  return;
 }

 msg("در حال ثبت‌نام...");

 const {data,error}=await db.auth.signUp({
  email,
  password,
  options:{data:{username,display_name}}
 });

 if(error){
  msg("خطا: "+error.message);
  return;
 }

 if(data.session){
  msg("ثبت‌نام موفق بود!");
 }else{
  msg("حساب ساخته شد! ایمیلت را برای تأیید بررسی کن.");
 }

 await updateProfile();
 await loadStreams();
}

async function login(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password){
  msg("ایمیل و رمز عبور را وارد کن.");
  return;
 }

 msg("در حال ورود...");

 const {error}=await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  msg("خطا: "+error.message);
  return;
 }

 msg("با موفقیت وارد شدی!");
 await updateProfile();
 await loadStreams();
}

async function logout(){
 await db.auth.signOut();
 msg("از حساب خارج شدی.");
 await updateProfile();
}

async function updateProfile(){
 const {data}=await db.auth.getUser();

 if(data.user){
  const name=data.user.user_metadata?.display_name||
             data.user.user_metadata?.username||
             data.user.email;

  $("profile").textContent="سلام "+name+"، خوش اومدی 💜";
  $("logoutBtn").hidden=false;
 }else{
  $("profile").textContent="هنوز وارد حساب نشده‌ای.";
  $("logoutBtn").hidden=true;
 }
}

async function createStream(){
 const {data}=await db.auth.getUser();

 if(!data.user){
  msg("برای ساخت استریم اول وارد حساب شو.");
  return;
 }

 const title=$("streamTitle").value.trim();
 const category=$("streamCategory").value.trim();
 const description=$("streamDescription").value.trim();

 if(!title){
  msg("عنوان استریم را وارد کن.");
  return;
 }

 msg("در حال ساخت استریم...");

 const {error}=await db.from("streams").insert({
  streamer_id:data.user.id,
  title,
  category,
  description,
  status:"offline"
 });

 if(error){
  msg("خطا: "+error.message);
  return;
 }

 msg("استریم با موفقیت ساخته شد!");
 $("streamTitle").value="";
 $("streamCategory").value="";
 $("streamDescription").value="";
 await loadStreams();
}

async function loadStreams(){
 const area=$("streams");
 area.textContent="در حال بارگذاری...";

 const {data,error}=await db
  .from("streams")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  area.textContent="خطا در دریافت استریم‌ها: "+error.message;
  return;
 }

 area.innerHTML="";

 if(!data||data.length===0){
  area.textContent="هنوز استریمی ساخته نشده است.";
  return;
 }

 data.forEach(stream=>{
  const item=document.createElement("div");
  item.className="stream";

  const title=document.createElement("h3");
  title.textContent=stream.title;

  const category=document.createElement("p");
  category.textContent="دسته‌بندی: "+(stream.category||"عمومی");

  const status=document.createElement("small");
  status.textContent=stream.status==="live"?"🔴 زنده":"⚫ آفلاین";

  item.append(title,category,status);
  area.appendChild(item);
 });
}

$("signupBtn").addEventListener("click",signup);
$("loginBtn").addEventListener("click",login);
$("logoutBtn").addEventListener("click",logout);
$("createBtn").addEventListener("click",createStream);
$("refreshBtn").addEventListener("click",loadStreams);

db.auth.onAuthStateChange(()=>{
 updateProfile();
});

(async()=>{
 await updateProfile();
 await loadStreams();
})();
</script>
</body>
</html>

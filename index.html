
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080812;
 color:white;
 font-family:Tahoma,Arial;
 text-align:center;
 min-height:100vh;
}

header{
 padding:24px;
 background:#111124;
 border-bottom:1px solid #853cff;
}

.logo{
 font-size:32px;
 font-weight:bold;
 color:#a855f7;
}

.logo span{color:#00d9ff}

main{
 max-width:440px;
 margin:45px auto;
 padding:15px;
}

.card{
 background:#141426;
 padding:25px;
 border-radius:18px;
 border:1px solid #6934a8;
 box-shadow:0 0 25px #7722aa33;
}

h2{color:#bd83ff}

input{
 width:100%;
 padding:15px;
 margin:8px 0;
 border-radius:9px;
 border:1px solid #454560;
 background:#090916;
 color:white;
 font-size:15px;
}

button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:9px;
 background:linear-gradient(90deg,#812cff,#00bfff);
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{opacity:.5}

.secondary{
 background:#25253d;
 border:1px solid #8654bd;
}

.switch{
 color:#00d9ff;
 cursor:pointer;
 margin-top:20px;
}

#msg{
 color:#ff9bca;
 line-height:2;
 font-size:13px;
 overflow-wrap:anywhere;
}

#account{display:none}

footer{
 margin:30px 15px;
 padding:20px 10px;
 color:#777;
 font-size:12px;
 line-height:2;
 border-top:1px solid #29203d;
}

.creator{
 color:#a855f7;
 font-weight:bold;
 font-size:13px;
 text-shadow:0 0 10px #a855f766;
}

@media(max-width:480px){
 main{
  margin:25px auto;
  padding:12px;
 }
 header{padding:20px}
 .logo{font-size:28px}
 .card{padding:20px}
}
</style>
</head>

<body>

<header>
 <div class="logo">NEXORA <span>LIVE</span></div>
 <p>دنیای استریم و سرگرمی</p>
</header>

<main>

<div class="card" id="auth">
 <h2 id="title">ساخت حساب کاربری</h2>

 <input id="displayName" placeholder="نام نمایشی">
 <input id="username" placeholder="نام کاربری">
 <input id="email" type="email" placeholder="ایمیل">
 <input id="password" type="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)">

 <button id="action" onclick="submitAuth()">ثبت نام</button>

 <button class="secondary" onclick="resendEmail()">
 ارسال مجدد ایمیل تأیید
 </button>

 <div class="switch" onclick="toggleMode()" id="switch">
 قبلاً حساب ساخته‌ام | ورود
 </div>

 <p id="msg"></p>
</div>

<div class="card" id="account">
 <h2>به NEXORA LIVE خوش آمدی!</h2>
 <p id="welcome"></p>
 <button onclick="logout()">خروج از حساب</button>
</div>

<footer>
 NEXORA LIVE © 2026
 <br>
 <span class="creator">
 Created by Kasra Kazemi 💜
 </span>
</footer>

</main>

<script>
const SUPABASE_URL =
'https://vpaendrlgltucjvayjcr.supabase.co';

const SUPABASE_KEY =
'sb_publishable_ebelTlrDPzeqZKQpUqWE_g_VB0SGC1c';

const db=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true
  }
 }
);

const redirectURL=window.location.origin+'/';
let isLogin=false;

function message(text){
 document.getElementById('msg').textContent=text;
}

function toggleMode(){
 isLogin=!isLogin;

 document.getElementById('title').textContent=
 isLogin?'ورود به حساب':'ساخت حساب کاربری';

 document.getElementById('action').textContent=
 isLogin?'ورود':'ثبت نام';

 document.getElementById('switch').textContent=
 isLogin?'حساب ندارم | ثبت نام':'قبلاً حساب ساخته‌ام | ورود';

 document.getElementById('displayName').style.display=
 isLogin?'none':'block';

 document.getElementById('username').style.display=
 isLogin?'none':'block';

 message('');
}

async function submitAuth(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const username=document.getElementById('username').value.trim().toLowerCase();
 const display_name=document.getElementById('displayName').value.trim()||username;

 if(!email||!password){
  message('ایمیل و رمز عبور را وارد کن.');
  return;
 }

 if(password.length<6){
  message('رمز عبور باید حداقل ۶ کاراکتر باشد.');
  return;
 }

 if(!isLogin&&!username){
  message('نام کاربری را وارد کن.');
  return;
 }

 const btn=document.getElementById('action');
 btn.disabled=true;
 btn.textContent='لطفاً صبر کن...';

 try{
  let result;

  if(isLogin){
   result=await db.auth.signInWithPassword({
    email,password
   });
  }else{
   result=await db.auth.signUp({
    email,password,
    options:{
     emailRedirectTo:redirectURL,
     data:{username,display_name}
    }
   });
  }

  if(result.error){
   message(result.error.message);
   return;
  }

  if(isLogin){
   showAccount(result.data.user);
   message('ورود موفق بود!');
  }else if(result.data.session){
   showAccount(result.data.user);
   message('ثبت نام موفق بود!');
  }else{
   message('ثبت نام انجام شد! ایمیلت را بررسی کن.');
  }

 }catch(error){
  message(error.message);
 }finally{
  btn.disabled=false;
  btn.textContent=isLogin?'ورود':'ثبت نام';
 }
}

async function resendEmail(){
 const email=document.getElementById('email').value.trim();

 if(!email){
  message('اول ایمیلت را وارد کن.');
  return;
 }

 const btn=document.querySelector('.secondary');
 btn.disabled=true;
 btn.textContent='در حال ارسال...';

 try{
  const {error}=await db.auth.resend({
   type:'signup',
   email:email,
   options:{
    emailRedirectTo:redirectURL
   }
  });

  if(error){
   message(error.message);
  }else{
   message('درخواست ارسال ایمیل ثبت شد. صندوق ورودی و پوشه Spam را بررسی کن.');
  }
 }catch(error){
  message(error.message);
 }finally{
  btn.disabled=false;
  btn.textContent='ارسال مجدد ایمیل تأیید';
 }
}

function showAccount(user){
 if(!user)return;

 document.getElementById('auth').style.display='none';
 document.getElementById('account').style.display='block';

 const name=user.user_metadata?.display_name||
 user.user_metadata?.username||user.email;

 document.getElementById('welcome').textContent='سلام '+name+' 👋';
}

async function logout(){
 const {error}=await db.auth.signOut();

 if(error){
  message(error.message);
  return;
 }

 document.getElementById('account').style.display='none';
 document.getElementById('auth').style.display='block';
 document.getElementById('password').value='';
 message('با موفقیت خارج شدی.');
}

async function initialize(){
 const {data,error}=await db.auth.getSession();

 if(error){
  message(error.message);
  return;
 }

 if(data.session){
  showAccount(data.session.user);
 }
}

db.auth.onAuthStateChange((event,session)=>{
 if(session?.user){
  showAccount(session.user);
 }
});

initialize();
</script>

</body>
</html>
